<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#212830">
<link rel="icon" href="/icons/icon-32.png">
<link rel="stylesheet" href="/login.css">
<title>登入 VidoViewer</title>
</head>
<body>
<main>
<h1 class="brand"><img src="/icons/logo-192.png" alt="" width="56" height="56">VidoViewer</h1>
<form action="/api/login" method="post">
<label>帳號<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
<label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
<input type="hidden" name="next" value="/">
<p id="error" role="alert" hidden>帳號或密碼錯誤</p>
<button type="submit">登入</button>
</form>
</main>
<script src="/login.js"></script>
</body>
</html>
